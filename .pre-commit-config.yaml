repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-merge-conflict

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: master
    hooks:
    - id: go-fmt
    - id: go-vet
    - id: go-imports
    - id: go-cyclo
      args: [-over=25]
      exclude: '(_test|column_array)\.go$'
    - id: validate-toml
    - id: golangci-lint
    - id: go-unit-tests
    - id: go-build
    - id: go-mod-tidy
    - id: go-mod-vendor

  - repo: local
    hooks:
    - id: errcheck
      name: errcheck
      entry: go tool errcheck -blank -ignoretests ./...
      language: system
      pass_filenames: false
      types: [go]
