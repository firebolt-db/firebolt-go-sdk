name: Engine integration tests

on:
  workflow_dispatch:
    inputs:
      os_name:
        description: 'GitHub-hosted runner label (ubuntu-latest, macos-latest, or windows-latest)'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      os_name:
        description: 'GitHub-hosted runner label (ubuntu-latest, macos-latest, or windows-latest)'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  packages: read

jobs:
  integration-tests:
    # Allowlist runner labels so an unexpected workflow_call input cannot
    # target a self-hosted runner. Unknown values fall back to ubuntu-latest.
    runs-on: ${{ inputs.os_name == 'macos-latest' && 'macos-latest' || inputs.os_name == 'windows-latest' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      DOCKER_COMPOSE_FILE: ${{ github.workspace }}/.github/engine/docker-compose.yaml
      SERVICE_PORT: 3473
      SERVICE_URL: http://localhost:3473
      MAX_RETRIES: 30
      RETRY_INTERVAL: 2
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate localhost certificate
        run: |
          mkdir "${{ github.workspace }}/.github/engine/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "${{ github.workspace }}/.github/engine/certs/localhost-key.pem" \
            -out "${{ github.workspace }}/.github/engine/certs/localhost.pem" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"

      - name: Trust self-signed cert
        run: |
          sudo cp "${{ github.workspace }}/.github/engine/certs/localhost.pem" /usr/local/share/ca-certificates/localhost.crt
          sudo update-ca-certificates

      - name: Prepare docker-compose.yml
        run: |
          if [ ! -f "$DOCKER_COMPOSE_FILE" ]; then
            echo "Error: Docker compose file not found at $DOCKER_COMPOSE_FILE"
            exit 1
          fi
          sed -i "s|\${BASE_DIR}|${{ github.workspace }}|g" "$DOCKER_COMPOSE_FILE"
          echo "Docker compose file prepared:"
          cat "$DOCKER_COMPOSE_FILE"

      - name: Start service container
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" up -d
          docker compose -f "$DOCKER_COMPOSE_FILE" ps

      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 "$MAX_RETRIES"); do
            if curl --silent --fail "$SERVICE_URL" --data-binary "SELECT 1" | grep -q "1"; then
              echo "Service is up and responding!"
              exit 0
            fi
            echo "Waiting for service... ($i/$MAX_RETRIES)"
            sleep "$RETRY_INTERVAL"
          done
          echo "Error: Service failed to start within timeout"
          docker compose -f "$DOCKER_COMPOSE_FILE" logs
          exit 1

      - name: Run integration tests
        run: go test ./... -timeout=30m -v --tags=integration_engine,integration_batch

      - name: Stop container
        if: always()
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" down
