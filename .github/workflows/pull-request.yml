name: Pull request

on:
  pull_request:
    branches: [ main, 1.x ]
    types: [ opened, synchronize, reopened, edited ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  code-checkers:
    permissions:
      contents: read
    uses: ./.github/workflows/code-check.yml
  engine-integration-tests:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/integration-test-engine.yml
