# HTTP tests connect directly to the Engine port exposed by Docker.
# This proxy provides HTTPS coverage for the same Engine instance.

# HTTPS server
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    location / {
        proxy_pass http://firebolt-engine:3473;
        proxy_set_header Host $host;
    }
}
